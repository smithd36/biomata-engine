[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "biomata-engine"
version = "0.5.0"
description = "A framework for autonomous agent simulations"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "networkx>=3.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
ollama  = ["httpx>=0.27"]
openai  = ["openai>=1.0"]
viz     = ["rich>=13.0"]
dev     = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.0"]

[project.scripts]
biomata-engine = "engine.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
