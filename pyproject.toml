[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomata-engine"
version = "0.5.0"
description = "A framework for autonomous agent simulations"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "networkx>=3.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
ollama  = ["httpx>=0.27"]
openai  = ["openai>=1.0"]
viz     = ["rich>=13.0"]
grpc      = ["grpcio>=1.60", "grpcio-tools>=1.60"]
websocket = ["websockets>=12.0"]
dev       = [
    "pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.0",
    "grpcio>=1.60", "grpcio-tools>=1.60",
    "websockets>=12.0",
]

[project.scripts]
biomata-engine = "engine.cli.main:main"
biomata-grpc   = "src.transport.grpc.server:main"
biomata-ws     = "src.transport.websocket.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
