# examples/medieval/sim.yaml
# Run with: src run examples/medieval/sim.yaml
# Or:       python -m cli.main examples/medieval/sim.yaml

engine:
  ticks: 15
  seed: 42
  scheduler: simultaneous   # or "sequential" for deterministic/debuggable runs

llm:
  model: qwen2.5:14b
  base_url: http://localhost:11434
  temperature: 0.8

world:
  class: examples.medieval.sim.world.MedievalWorld
  width: 5
  height: 5
  seed: 42

registry:
  class: examples.medieval.sim.registry.build_medieval_registry

social:
  class: src.plugins.builtin.simple_social.social.WeightedGraphSocial

agents:
  - id: agent_001
    name: Aldric
    position: {x: 2, y: 2}
    brain:
      class: src.plugins.builtin.ollama.brain.OllamaLLMBrain
      personality:
        traits: [ambitious, strategic, distrustful]
        goals: [accumulate gold, become faction leader]
        backstory: A former merchant who lost everything to a corrupt guild.
    state_ext:
      class: examples.medieval.sim.vitals.MedievalVitals

  - id: agent_002
    name: Mira
    position: {x: 2, y: 2}
    brain:
      class: src.plugins.builtin.ollama.brain.OllamaLLMBrain
      personality:
        traits: [empathetic, resourceful, cautious]
        goals: [ensure nearby agents have food, avoid conflict]
        backstory: A healer who believes cooperation is the only path to survival.
    state_ext:
      class: examples.medieval.sim.vitals.MedievalVitals

  - id: agent_003
    name: Crow
    position: {x: 0, y: 0}
    brain:
      class: src.plugins.builtin.ollama.brain.OllamaLLMBrain
      personality:
        traits: [impulsive, brave, curious]
        goals: [explore uncharted lands, find ancient artifacts]
        backstory: A young scout with no memory of their origins.
    state_ext:
      class: examples.medieval.sim.vitals.MedievalVitals
   
  - id: agent_004
    name: Seraphine
    position: {x: 3, y: 1}
    brain:
      class: src.plugins.builtin.ollama.brain.OllamaLLMBrain
      personality:
        traits: [charismatic, manipulative, patient]
        goals: [build a network of influence, uncover political secrets]
        backstory: A displaced noble who survived a palace coup by reinventing herself among commoners.
    state_ext:
      class: examples.medieval.sim.vitals.MedievalVitals

  - id: agent_005
    name: Toren
    position: {x: 1, y: 4}
    brain:
      class: src.plugins.builtin.ollama.brain.OllamaLLMBrain
      personality:
        traits: [loyal, stoic, pragmatic]
        goals: [protect trusted allies, establish a defensible settlement]
        backstory: A former castle guard who abandoned his post after refusing an unjust execution order.
    state_ext:
      class: examples.medieval.sim.vitals.MedievalVitals